<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo | Keep Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="catalogo">
<div id="site-header"></div>
<main class="page"><div class="container">
  <h1 class="section__title">Catálogo</h1>
  <div class="toolbar">
    <div class="filters" id="filters" role="group" aria-label="Filtrar por categoria"></div>
    <input type="search" id="search" class="search" placeholder="Pesquisar sapato" aria-label="Pesquisar produtos">
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
  <p class="empty" id="empty" hidden>Nenhum produto encontrado nesta categoria.</p>
</div></main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
