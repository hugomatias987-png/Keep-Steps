<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Início | Keep Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div id="site-header"></div>
<main>
  <section class="hero" id="inicio">
    <!-- IMAGEM DE DESTAQUE: assets/images/hero.jpg -->
    <img class="hero__img" src="assets/images/hero.jpg" alt="" onerror="this.remove()">
    <div class="container hero__content">
      <h1 id="heroName">Keep Steps</h1>
      <p class="hero__tagline" id="tagline"></p>
      <div class="hero__actions">
        <a href="catalogo.html" class="btn btn--light">Ver catálogo</a>
        <a href="#" class="btn btn--wa" id="heroWa">Falar no WhatsApp</a>
      </div>
    </div>
  </section>
  <hr class="divider">
  <section class="section">
    <div class="container">
      <div class="section__head"><h2 class="section__title">Novidades</h2><a class="link-more" href="catalogo.html">Ver todo o catálogo</a></div>
      <div class="grid" id="featured"></div>
    </div>
  </section>
  <section class="section section--alt">
    <div class="container">
      <h2 class="section__title">Escolha por categoria</h2>
      <div class="cats" id="cats"></div>
    </div>
  </section>
  <section class="section">
    <div class="container"><div class="cta-band"><p>Tem dúvidas sobre um modelo ou tamanho?</p><a class="btn btn--wa btn--big" href="contacto.html">Fale connosco</a></div></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
